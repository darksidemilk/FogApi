name: Test Build

on:
  workflow_dispatch:
  # push:
  #   branches:
  #     - master
  pull_request:
    branches:
      - master
      - dev

jobs:
    enforce-dev-to-master:
        if: github.event_name == 'pull_request' && github.base_ref == 'master'
        runs-on: ubuntu-latest

        steps:
        - name: Require PRs into master to come from dev
          run: |
            if [ "${{ github.head_ref }}" != "dev" ]; then
              echo "::error::Pull requests into master must come from dev (see docs/Contributing.md for the git flow). This PR's source branch is '${{ github.head_ref }}'."
              exit 1
            fi
            echo "OK: source branch is dev"

    build:
        # The module advertises CompatiblePSEditions Core and describes itself as a crossplatform
        # cli for fog, so linux is a supported target and needs to be built and tested like one.
        # Nothing here needs a server, so the linux leg costs a runner and nothing else.
        #
        # The linux leg earns its keep now that there is a compiled half: it is where a backslash
        # in a manifest path, or en-us against en-US for the help folder, actually fails.
        strategy:
            fail-fast: false
            matrix:
                os: [windows-latest, ubuntu-latest]
        runs-on: ${{ matrix.os }}

        steps:
        - uses: actions/checkout@v7

        # The module has a compiled core now. Without an SDK the build produces no
        # bin/FogApi.Core.dll, and the manifest names it in RequiredAssemblies -- so
        # Test-ModuleManifest fails and nothing imports. global-json-file keeps the CI
        # SDK and the one developers install pinned to the same version.
        - uses: actions/setup-dotnet@v4
          with:
            global-json-file: global.json

        - name: Run build script
          shell: pwsh
          run: |
            # Install-PSResource -Name  PlatyPS -TrustRepository -Version 0.14.2 -Scope CurrentUser -AcceptLicense
            $moduleName="FogApi";
            ./invoke-modulebuild.ps1
            $builtPath = Join-Path '.' '_module_build' $moduleName
            ls -recurse $builtPath;
            if (Test-Modulemanifest -path (Join-Path $builtPath "$moduleName.psd1")) {
                import-module $builtPath -ea 0
                if ($null -ne (Get-module $modulename -ea 0)) {
                    "Built module imported successfully!`n$((Get-module $modulename) | out-string)" | out-host
                    return $true;
                } else {
                    Write-Error "Failed to import module!"
                    return $false;
                }
            } else {
                Write-Error "Manifest threw error"
                return $false;
            }

    test:
        strategy:
            fail-fast: false
            matrix:
                os: [windows-latest, ubuntu-latest]
        runs-on: ${{ matrix.os }}
        needs: build

        steps:
        - uses: actions/checkout@v7

        - uses: actions/setup-dotnet@v4
          with:
            global-json-file: global.json

        # The tests import the module, which needs the compiled core. This job does
        # not inherit the build job's output.
        - name: Build the compiled core
          shell: pwsh
          run: ./build-dotnet.ps1

        # Every export list in this build degrades to a SHORTER list rather than to an
        # error, and the gallery publishes a short list without complaint. Three separate
        # paths have done it: Export-ModuleMember without -Cmdlet, Set-EmptyExportArray
        # forcing CmdletsToExport = @(), and Get-AliasesToExport text-scanning files that
        # no longer exist. Floors, not exact counts: adding a command must not fail this,
        # losing most of them must.
        - name: Verify the module exports what it has
          shell: pwsh
          run: |
            Import-Module ./FogApi/FogApi.psd1 -Force -ErrorAction Stop
            $m = Get-Module FogApi
            "functions=$($m.ExportedFunctions.Count) cmdlets=$($m.ExportedCmdlets.Count) aliases=$($m.ExportedAliases.Count)" | Out-Host
            if ($m.ExportedCmdlets.Count   -lt 150) { throw "CmdletsToExport regressed: $($m.ExportedCmdlets.Count)" }
            if ($m.ExportedFunctions.Count -lt 50)  { throw "FunctionsToExport regressed: $($m.ExportedFunctions.Count)" }
            if ($m.ExportedAliases.Count   -lt 70)  { throw "AliasesToExport regressed: $($m.ExportedAliases.Count)" }
            # Function over CMDLET specifically. A name that is both a Function and an
            # Alias is normal here and always has been -- the plural list names
            # (Get-FogImages, Get-FogSnapins) are kept as aliases on purpose, so a
            # blanket "more than one CommandType" test flags ten of those and says
            # nothing. What must never happen is a .ps1 outranking a compiled cmdlet,
            # because PowerShell resolves the function first and the cmdlet becomes
            # dead code that silently never runs.
            $fn = $m.ExportedFunctions.Keys
            $shadowed = @($m.ExportedCmdlets.Keys | Where-Object { $fn -contains $_ })
            if ($shadowed) { throw "a function is shadowing a cmdlet: $($shadowed -join ', ')" }

        # A real gate now, on by default, and NOT continue-on-error.
        #
        # It was none of those things, for good reasons that no longer apply.
        # The suite it used to run was a mock-up: every response came from
        # Tests/Fixtures, so it asserted that the module still produced the
        # shape somebody wrote down rather than the shape the server sends, and
        # a new cmdlet with no fixture failed it for a reason that said nothing
        # about the change. A red step nobody is meant to act on teaches people
        # to ignore red steps, so it was switched off.
        #
        # That suite is deleted. What runs here fakes nothing: the spec drift
        # gate, the model and wire-type unit tests, the transport's request
        # construction, cross-platform paths, and the ETS type data. None of it
        # needs a server, all of it fails for a reason worth reading.
        #
        # Behaviour against FOG is asserted by Tests/FogApi.RealServer.Tests.ps1
        # and by ./Invoke-FogApiConformance.ps1, both run locally against a dev
        # server for now. Wiring those into CI needs a FOG install per run --
        # FOGProject/fog-workflows already has reusable_api_validation.yml for
        # exactly that, and connecting the two is the next step, not this one.
        - name: Run Pester tests
          shell: pwsh
          # A run that reaches the network is a bug in the test, not a feature
          # of the environment. This makes it fail loudly rather than quietly
          # talking to whatever a stray settings file points at.
          env:
            FOGAPI_FORBID_NETWORK: '1'
          run: ./Invoke-FogApiTests.ps1 -CI

        # A clean profile has no settings file, which is the state that used to fail on linux -
        # the bootstrap copied from a path built with a hardcoded backslash and never resolved.
        # No existing test covers it, because the fixtures assume the file is already there.
        - name: Verify settings file bootstraps from a clean profile
          shell: pwsh
          run: |
            Import-Module ./FogApi/FogApi.psd1 -Force
            $settingsFile = Get-FogServerSettingsFile
            if (Test-Path $settingsFile) { Remove-Item $settingsFile -Force }
            $null = Get-FogServerSettings -wa 0
            if (!(Test-Path $settingsFile)) {
                Write-Error "Settings file was not bootstrapped at $settingsFile"
                exit 1
            }
            "OK: bootstrapped $settingsFile" | Out-Host

        - name: Upload test results
          if: ${{ always() }}
          uses: actions/upload-artifact@v4
          with:
            name: pester-results-${{ matrix.os }}
            path: TestResults/pester-results.xml
