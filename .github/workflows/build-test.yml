name: Test Build

on:
  workflow_dispatch:
  # push:
  #   branches:
  #     - master
  pull_request:
    branches:
      - master
      - dev

jobs:
    enforce-dev-to-master:
        if: github.event_name == 'pull_request' && github.base_ref == 'master'
        runs-on: ubuntu-latest

        steps:
        - name: Require PRs into master to come from dev
          run: |
            if [ "${{ github.head_ref }}" != "dev" ]; then
              echo "::error::Pull requests into master must come from dev (see docs/Contributing.md for the git flow). This PR's source branch is '${{ github.head_ref }}'."
              exit 1
            fi
            echo "OK: source branch is dev"

    build:
        # The module advertises CompatiblePSEditions Core and describes itself as a crossplatform
        # cli for fog, so linux is a supported target and needs to be built and tested like one.
        # Everything here is mocked, so the linux leg costs a runner and nothing else.
        strategy:
            fail-fast: false
            matrix:
                os: [windows-latest, ubuntu-latest]
        runs-on: ${{ matrix.os }}

        steps:
        - uses: actions/checkout@v7

        - name: Run build script
          shell: pwsh
          run: |
            # Install-PSResource -Name  PlatyPS -TrustRepository -Version 0.14.2 -Scope CurrentUser -AcceptLicense
            $moduleName="FogApi";
            ./invoke-modulebuild.ps1
            $builtPath = Join-Path '.' '_module_build' $moduleName
            ls -recurse $builtPath;
            if (Test-Modulemanifest -path (Join-Path $builtPath "$moduleName.psd1")) {
                import-module $builtPath -ea 0
                if ($null -ne (Get-module $modulename -ea 0)) {
                    "Built module imported successfully!`n$((Get-module $modulename) | out-string)" | out-host
                    return $true;
                } else {
                    Write-Error "Failed to import module!"
                    return $false;
                }
            } else {
                Write-Error "Manifest threw error"
                return $false;
            }

    test:
        strategy:
            fail-fast: false
            matrix:
                os: [windows-latest, ubuntu-latest]
        runs-on: ${{ matrix.os }}
        needs: build

        steps:
        - uses: actions/checkout@v7

        - name: Run Pester tests
          shell: pwsh
          run: ./Invoke-FogApiTests.ps1 -CI

        # A clean profile has no settings file, which is the state that used to fail on linux -
        # the bootstrap copied from a path built with a hardcoded backslash and never resolved.
        # No existing test covers it, because the fixtures assume the file is already there.
        - name: Verify settings file bootstraps from a clean profile
          shell: pwsh
          run: |
            Import-Module ./FogApi/FogApi.psd1 -Force
            $settingsFile = Get-FogServerSettingsFile
            if (Test-Path $settingsFile) { Remove-Item $settingsFile -Force }
            $null = Get-FogServerSettings -wa 0
            if (!(Test-Path $settingsFile)) {
                Write-Error "Settings file was not bootstrapped at $settingsFile"
                exit 1
            }
            "OK: bootstrapped $settingsFile" | Out-Host

        - name: Upload test results
          if: always()
          uses: actions/upload-artifact@v4
          with:
            name: pester-results-${{ matrix.os }}
            path: TestResults/pester-results.xml

        - name: Upload coverage report
          if: always()
          uses: actions/upload-artifact@v4
          with:
            name: parameter-set-coverage-report-${{ matrix.os }}
            path: TestResults/coverage-report.md
